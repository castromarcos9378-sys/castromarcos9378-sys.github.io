<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#132b48">
<meta name="application-name" content="DAOS">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DAOS">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./daos-icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>DAOS</title>
<style>
html,body{margin:0;min-height:100%;background:#132b48;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.card{max-width:420px}.mark{font-weight:800;letter-spacing:.18em;font-size:2rem}.sub{opacity:.8;margin-top:8px}.err{margin-top:18px;color:#ffd58a;white-space:pre-wrap}
</style>
</head>
<body><main><div class="card"><div class="mark">DAOS</div><div class="sub">Registro de Obra Móvil</div><div id="s" class="sub">Abriendo aplicación…</div><div id="e" class="err"></div></div></main>
<script>
(async()=>{try{
 if(!('DecompressionStream' in window)) throw new Error('Actualiza Chrome para abrir DAOS.');
 const r=await fetch('./app.html.gz',{cache:'no-store'}); if(!r.ok) throw new Error('No se pudo cargar la aplicación ('+r.status+').');
 const ds=new DecompressionStream('gzip'); const txt=await new Response(r.body.pipeThrough(ds)).text();
 document.open();document.write(txt);document.close();
}catch(err){document.getElementById('s').textContent='No se pudo iniciar DAOS';document.getElementById('e').textContent=err.message+'\nVerifica tu conexión e inténtalo de nuevo.';}})();
</script></body></html>
