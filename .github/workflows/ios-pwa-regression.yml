name: Pruebas PWAs ATALIA y DAOS
on:
  push:
    branches:
      - feature/ios-personal-marcos-jose-andres-20260928
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-pwa-and-security-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar instalacion unica, seguridad y sintaxis
        run: node --test tests/pwa-update-regression.test.cjs
