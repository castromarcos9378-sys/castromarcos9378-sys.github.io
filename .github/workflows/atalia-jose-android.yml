name: Atalia Jose Android APK
on:
  push:
    paths:
      - '.github/workflows/atalia-jose-android.yml'
      - 'android-jose/**'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: cd android-jose && gradle --no-daemon assembleDebug
      - name: Verify APK before delivery
        run: |
          APK=android-jose/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -25
          ls -lh "$APK"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Atalia-Jose-Android-APK
          path: android-jose/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
