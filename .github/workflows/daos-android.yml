name: DAOS Andrés · APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - daos-andres-tablet-v08-20261026
    paths:
      - 'atalia/daos/andres/android/**'
      - '.github/workflows/daos-android.yml'

permissions:
  contents: read

concurrency:
  group: daos-andres-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: atalia/daos/andres/android
    steps:
      - name: Obtener código aprobado
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Preparar Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '8.10.2'

      - name: Preparar firma privada si está configurada
        shell: bash
        env:
          KEY_B64: ${{ secrets.DAOS_SIGNING_KEYSTORE_B64 }}
          KEY_STORE_PASS: ${{ secrets.DAOS_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DAOS_SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.DAOS_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEY_B64" || -z "$KEY_STORE_PASS" || -z "$KEY_ALIAS" || -z "$KEY_PASS" ]]; then
            echo "SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "APK de diagnóstico; firma definitiva pendiente."
            exit 0
          fi
          printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/daos-release.keystore"
          chmod 600 "$RUNNER_TEMP/daos-release.keystore"
          echo "DAOS_SIGNING_STORE=$RUNNER_TEMP/daos-release.keystore" >> "$GITHUB_ENV"
          echo "DAOS_SIGNING_STORE_PASSWORD=$KEY_STORE_PASS" >> "$GITHUB_ENV"
          echo "DAOS_SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "DAOS_SIGNING_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          echo "SIGNING_READY=true" >> "$GITHUB_ENV"

      - name: Compilar APK firmada definitiva
        if: env.SIGNING_READY == 'true'
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Compilar APK de diagnóstico
        if: env.SIGNING_READY != 'true'
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Conservar APK compilada
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: daos-andres-apk-${{ github.run_number }}
          path: atalia/daos/andres/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
