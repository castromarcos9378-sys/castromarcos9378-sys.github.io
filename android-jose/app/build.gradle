plugins { id 'com.android.application' }
android {
    namespace 'com.ecmconstructores.atalia.jose'
    compileSdk 35
    defaultConfig {
        applicationId 'com.ecmconstructores.atalia.jose'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }
    signingConfigs { debug { enableV1Signing = true; enableV2Signing = true } }
    buildTypes { release { minifyEnabled false } }
}
