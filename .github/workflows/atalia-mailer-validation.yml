name: Atalia mailer validation
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/atalia-mailer-validation.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Send simple test email
        run: |
          for i in $(seq 1 18); do
            if curl --fail --silent --show-error "https://atalia-tableta-mailer.vercel.app/api/atalia-mail-test-7f4c9d2a?k=1QigbBcw5sgPn80xzkPXXNftc-8wTn7b&mode=basic"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
